<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCR Incident Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --border:#e2e4e9;
    --text:#1c1f26;
    --text-muted:#6b7280;
    --scam:#7c3aed;
    --scam-bg:#f3e8ff;
    --theft:#0d9488;
    --theft-bg:#ccfbf1;
    --violence:#4338ca;
    --violence-bg:#e0e7ff;
    --accent:#0f766e;
    --accent-hover:#0d5f59;
    --shadow: 0 2px 10px rgba(20,20,30,0.08), 0 1px 2px rgba(20,20,30,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a;
      --panel:#1d2027;
      --border:#2c303a;
      --text:#eceef2;
      --text-muted:#9aa1ad;
      --scam-bg:#2c1a4a;
      --theft-bg:#0f2e2a;
      --violence-bg:#20204a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a;
    --panel:#1d2027;
    --border:#2c303a;
    --text:#eceef2;
    --text-muted:#9aa1ad;
    --scam-bg:#2c1a4a;
    --theft-bg:#0f2e2a;
    --violence-bg:#20204a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    padding:10px 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    z-index:1000;
  }
  .title-block{display:flex;flex-direction:column;gap:2px;min-width:180px;padding-top:2px;}
  .title-block h1{font-size:16px;margin:0;font-weight:650;}
  .title-block span{font-size:12px;color:var(--text-muted);}
  .toolbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .chip-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .chip-group .group-label{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-muted);margin-right:1px;
  }
  .actions-group{display:flex;align-items:center;gap:8px;padding-top:1px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel);
    padding:6px 12px;
    font-size:13px;
    font-weight:560;
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .chip:active{transform:scale(0.97);}
  .chip .shape{width:11px;height:11px;flex:none;display:flex;align-items:center;justify-content:center;}
  .chip.off{opacity:0.4;}
  .chip.scam{background:var(--scam-bg);color:var(--scam);border-color:transparent;}
  .chip.theft{background:var(--theft-bg);color:var(--theft);border-color:transparent;}
  .chip.violence{background:var(--violence-bg);color:var(--violence);border-color:transparent;}
  button.btn{
    display:flex;align-items:center;gap:6px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  button.btn:hover{background:var(--accent-hover);}
  button.btn.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  button.btn.secondary:hover{background:var(--bg);}
  #layout{flex:1;display:flex;min-height:0;}
  #map{flex:1;min-width:0;}
  #sidebar{
    width:300px;
    flex:none;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #sidebar.hidden{display:none;}
  #sidebar h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--text-muted);
    margin:0;
    padding:12px 14px 8px;
  }
  #report-list{
    flex:1;
    overflow-y:auto;
    padding:0 10px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .report-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .report-card:hover{background:var(--bg);}
  .report-card .top-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap;}
  .tag{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 7px;border-radius:999px;
  }
  .tag.scam{background:var(--scam-bg);color:var(--scam);}
  .tag.theft{background:var(--theft-bg);color:var(--theft);}
  .tag.violence{background:var(--violence-bg);color:var(--violence);}
  .report-card .date{font-size:11px;color:var(--text-muted);margin-left:auto;}
  .report-card .name{font-size:13.5px;font-weight:600;margin:0 0 2px;}
  .report-card .notes{font-size:12.5px;color:var(--text-muted);margin:0;}
  .empty-state{padding:16px;font-size:12.5px;color:var(--text-muted);}

  .leaflet-popup-content{font-size:13px;min-width:190px;}
  .leaflet-popup-content .tag{margin:0 4px 5px 0;}
  .leaflet-popup-content .popup-name{font-weight:650;margin:2px 0 3px;font-size:13.5px;}
  .leaflet-popup-content .popup-date{color:var(--text-muted);font-size:11.5px;margin-bottom:5px;}
  .leaflet-popup-content .popup-notes{margin-bottom:6px;}
  .article-link{
    display:inline-block;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;
  }
  .article-link:hover{text-decoration:underline;}
  .leaflet-popup-content .article-link{margin-bottom:6px;}
  .report-card .article-link{margin:2px 12px 2px;}

  /* YouTube thumbnail link â used in popups, list cards, and marker icons.
     Clicking it opens the video directly on youtube.com in a new tab.
     .yt-fallback sits underneath the <img> at all times; if the image
     loads, it visually covers the fallback completely, if it 404s/blocks,
     removing the <img> (via onerror) reveals a clear "watch on YouTube"
     placeholder instead of a blank box. */
  .yt-thumb{
    position:relative;display:block;overflow:hidden;border-radius:8px;
    background:linear-gradient(135deg,#2a2f3a,#1a1d24);margin-bottom:6px;
  }
  .yt-thumb .yt-fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:#fff;text-align:center;padding:8px;
  }
  .yt-thumb .yt-fallback span{font-size:11.5px;font-weight:600;opacity:0.9;}
  .yt-thumb img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;}
  .yt-thumb .play-badge{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }
  .yt-thumb .play-badge svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6));}
  .leaflet-popup-content .yt-thumb{width:240px;height:135px;}
  .report-card .yt-thumb{width:100%;height:110px;margin-bottom:6px;}
  .marker-yt-thumb{
    display:block;width:30px;height:30px;border-radius:7px;overflow:hidden;position:relative;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    background:linear-gradient(135deg,#2a2f3a,#1a1d24);
  }
  .marker-yt-thumb .yt-fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  }
  .marker-yt-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .marker-yt-thumb .ring{
    position:absolute;inset:0;border-radius:7px;box-sizing:border-box;border-width:3px;border-style:solid;
  }
  .marker-yt-thumb .play-dot{
    position:absolute;bottom:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
    background:#ff0000;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;
  }

  .leaflet-control-attribution{font-size:10.5px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>NCR Incident Map</h1>
    <span>Delhi &amp; Gurugram &middot; live OpenStreetMap, free &amp; no API key</span>
  </div>
  <div class="toolbar">
    <div class="chip-group" id="type-group">
      <span class="group-label">Type</span>
      <div class="chip scam" data-val="scam" onclick="toggleFilter(this,'scam')">
        <span class="shape">â</span><span id="count-type-scam">0</span> Scam
      </div>
      <div class="chip theft" data-val="theft" onclick="toggleFilter(this,'theft')">
        <span class="shape">â </span><span id="count-type-theft">0</span> Theft
      </div>
      <div class="chip violence" data-val="violence" onclick="toggleFilter(this,'violence')">
        <span class="shape">â²</span><span id="count-type-violence">0</span> Violence
      </div>
    </div>
    <div class="actions-group">
      <button class="btn secondary" onclick="toggleSidebar()">List</button>
    </div>
  </div>
</header>

<div id="layout">
  <div id="map"></div>
  <div id="sidebar">
    <h2>Reports</h2>
    <div id="report-list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---- report data ----
  // The map is read-only for visitors: this array is the single source of
  // truth. To add/update/remove a report, edit this array directly (via
  // Claude Code), then commit and push â there is no live-editing UI.
  // Each report is classified by a single axis: type (Scam/Theft/Violence).
  var reports = [
    {id:1, name:"コンノートプレイス â 耳かき屋の詐欺", type:"scam", date:"2026-08-23", notes:"コンノートプレイス周辺で見知らぬ男性が『耳の点検をしてあげる』と声をかけてくる。太陽光で耳の中を覗いた後、薬剤を塗った棒を耳に挿入し、点検料100ルピー、さらに『特別な薬』代として400ルピーを追加請求される。旅行者はその後頭痛と吐き気を訴えた。出典記事: note.com/michitaka64/n/n65b8a5eff0e4", lat:28.6330, lng:77.2175, link:"https://note.com/michitaka64/n/n65b8a5eff0e4"},
    {id:2, name:"インド門(India Gate) â 偽『観光省』ツアーオフィス", type:"scam", date:"2026-08-23", notes:"インド門付近で人懐っこい現地人が話しかけてきて、無料のオートリキシャ観光ツアーに誘う。その後、ドアに『Ministry of Tourism』と書かれた小さな看板を掲げた非公式の旅行代理店に連れて行かれ、割高な複数日ツアーパッケージの契約を迫られる。出典記事: note.com/mahiro_kobayashi/n/n8e4e651f43c9", lat:28.6129, lng:77.2295, link:"https://note.com/mahiro_kobayashi/n/n8e4e651f43c9"},
    {id:3, name:"ニューデリー駅周辺 â DTTDC恐喝事件", type:"violence", date:"2022-10-01", notes:"リキシャ運転手に『ディワリで道が通行止め』と嘘をつかれ、偽の政府観光公社DTTDCへ誘導される。断ってUberを呼んだところ、男に車を停車させられ脅されて2000ルピーを奪われた。出典記事: note.com/bbskktn/n/nf88d15a8dd06", lat:28.6435, lng:77.2140, link:"https://note.com/bbskktn/n/nf88d15a8dd06"},
    {id:4, name:"コンノートプレイス Gブロック â 偽観光案内所の詐欺", type:"scam", date:"2024-12-01", notes:"オートリキシャの運転手に誘導され、Gブロック23番地の『観光案内所』を名乗る施設へ。モンスーンで鉄道が遅延しタージマハルを見られなくなると不安を煽られ、アグラ行きの車チャーター(約3万円)を契約させられそうになった。出典記事: note.com/jomginjalan77/n/n5cb7caca24ff", lat:28.6328, lng:77.2192, link:"https://note.com/jomginjalan77/n/n5cb7caca24ff"},
    {id:5, name:"コンノートプレイス â 偽政府職員の詐欺", type:"scam", date:"2023-06-28", notes:"『政府職員』を名乗る男に声をかけられ、行方不明の学生に関する偽のニュース記事まで見せて不安を煽られた末、偽の許可証を掲げる旅行代理店へ連れて行かれ、3万7450ルピー(約6万円)の高額ツアーを契約させられた。後に警察介入をちらつかせてキャンセルに成功。出典記事: note.com/kosakamen/n/n7d2a1a449d89", lat:28.6320, lng:77.2183, link:"https://note.com/kosakamen/n/n7d2a1a449d89"},
    {id:6, name:"IGIエアポート ターミナル3-2間 â 偽タクシー誘導", type:"scam", date:"2025-01-21", notes:"空港内で道に迷っていたところ親切を装う男に声をかけられ、強引にタクシーに乗せられる。徒歩10分の距離にもかかわらず空港敷地内を15分ほど周回させられた末にターミナル2へ到着し、2000ルピーを請求された。出典記事: note.com/takuma_outdoor/n/n516986404418", lat:28.5545, lng:77.0985, link:"https://note.com/takuma_outdoor/n/n516986404418"},
    {id:7, name:"IGIエアポート â Uber二重請求詐欺", type:"scam", date:"2025-07-16", notes:"空港のUber乗り場で運転手がアプリ上の4桁認証コードを入力せず配車を開始。目的地到着後、クレジットカード決済を選択していたにもかかわらず『現金のみ』と言われ、アプリのカード請求と現金の二重請求をされそうになった。出典記事: note.com/journey_fore/n/n2a3b1c0e94e2", lat:28.5560, lng:77.1010, link:"https://note.com/journey_fore/n/n2a3b1c0e94e2"}
  ];

  var activeFilters = {scam:true, theft:true, violence:true};
  var markers = {};

  var map = L.map('map', {zoomControl:true}).setView([28.56, 77.15], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function ytThumbUrl(videoId){
    // i.ytimg.com is YouTube's actual image CDN (what youtube.com itself
    // uses for thumbnails). img.youtube.com is just a redirect to it, and
    // some network filters/ad-blockers block anything under the literal
    // "youtube.com" hostname while leaving ytimg.com untouched â hitting
    // the CDN directly avoids that.
    return 'https://i.ytimg.com/vi/'+videoId+'/hqdefault.jpg';
  }
  function cameraIconSvg(size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="14" height="12" rx="2"/><path d="M16.5 10.5l5-3v9l-5-3z"/></svg>';
  }
  function ytWatchUrl(videoId){
    return 'https://www.youtube.com/watch?v='+videoId;
  }
  function playBadgeSvg(size){
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.55)"/><polygon points="10,7.5 17,12 10,16.5" fill="#fff"/></svg>';
  }

  function typeColor(type){
    if(type === 'scam') return '#7c3aed';
    if(type === 'theft') return '#0d9488';
    return '#4338ca'; // violence
  }

  // Marker shape AND color both encode type, so the category is legible
  // even for colorblind viewers.
  function shapeSvg(type){
    var color = typeColor(type);
    if(type === 'scam'){
      return '<circle cx="8" cy="8" r="6.5" fill="'+color+'" stroke="#fff" stroke-width="2"/>';
    }
    if(type === 'theft'){
      return '<rect x="2" y="2" width="12" height="12" rx="2.5" fill="'+color+'" stroke="#fff" stroke-width="2"/>';
    }
    return '<polygon points="8,1.5 15,14.5 1,14.5" fill="'+color+'" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>';
  }

  function makeIcon(type, videoId){
    if(videoId){
      // The marker itself IS the thumbnail and links straight to YouTube on
      // click; the bound Leaflet popup (with notes) still opens too, since
      // the two don't conflict â one opens a new tab, one stays here.
      var html = '<a class="marker-yt-thumb" href="'+ytWatchUrl(videoId)+'" target="_blank" rel="noopener noreferrer" title="Watch on YouTube">'+
                    '<span class="yt-fallback">'+cameraIconSvg(15)+'</span>'+
                    '<img src="'+ytThumbUrl(videoId)+'" onerror="this.remove();">'+
                    '<span class="ring" style="border-color:'+typeColor(type)+';"></span>'+
                    '<span class="play-dot">'+playBadgeTriangle()+'</span>'+
                  '</a>';
      return L.divIcon({
        className:'',
        html: html,
        iconSize:[30,30],
        iconAnchor:[15,15],
        popupAnchor:[0,-15]
      });
    }
    var svg = '<svg width="17" height="17" viewBox="-1 -1 18 18" style="overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.45));">'+
              shapeSvg(type)+'</svg>';
    return L.divIcon({
      className:'',
      html: svg,
      iconSize:[17,17],
      iconAnchor:[8,9],
      popupAnchor:[0,-9]
    });
  }
  function playBadgeTriangle(){
    return '<svg width="8" height="8" viewBox="0 0 8 8"><polygon points="2,1 7,4 2,7" fill="#fff"/></svg>';
  }

  function videoThumbHtml(r){
    if(!r.video) return '';
    return '<a class="yt-thumb" href="'+ytWatchUrl(r.video)+'" target="_blank" rel="noopener noreferrer" title="Watch on YouTube">'+
             '<span class="yt-fallback">'+cameraIconSvg(26)+'<span>Watch on YouTube</span></span>'+
             '<img src="'+ytThumbUrl(r.video)+'" alt="YouTube thumbnail for '+escapeHtml(r.name)+'" onerror="this.remove();">'+
             '<span class="play-badge">'+playBadgeSvg(40)+'</span>'+
           '</a>';
  }

  function articleLinkHtml(r){
    if(!r.link) return '';
    return '<a class="article-link" href="'+r.link+'" target="_blank" rel="noopener noreferrer">Read source article ↗</a>';
  }

  function popupHtml(r){
    return videoThumbHtml(r)+
           '<span class="tag '+r.type+'">'+r.type+'</span>'+
           '<div class="popup-name">'+escapeHtml(r.name)+'</div>'+
           '<div class="popup-date">'+r.date+'</div>'+
           (r.notes ? '<div class="popup-notes">'+escapeHtml(r.notes)+'</div>' : '')+
           (r.link ? '<div>'+articleLinkHtml(r)+'</div>' : '');
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function addMarker(r){
    var m = L.marker([r.lat, r.lng], {icon: makeIcon(r.type, r.video)}).addTo(map);
    m.bindPopup(popupHtml(r));
    markers[r.id] = m;
  }

  function refreshCounts(){
    ['scam','theft','violence'].forEach(function(type){
      var n = reports.filter(function(r){return r.type===type;}).length;
      document.getElementById('count-type-'+type).textContent = n;
    });
  }

  function isVisible(r){
    return activeFilters[r.type];
  }

  function refreshVisibility(){
    reports.forEach(function(r){
      var m = markers[r.id];
      if(!m) return;
      var shouldShow = isVisible(r);
      var onMap = map.hasLayer(m);
      if(shouldShow && !onMap) m.addTo(map);
      if(!shouldShow && onMap) map.removeLayer(m);
    });
  }

  function renderList(){
    var list = document.getElementById('report-list');
    var visible = reports.filter(isVisible)
                          .sort(function(a,b){return b.date < a.date ? -1 : 1;});
    if(visible.length === 0){
      list.innerHTML = '<div class="empty-state">No reports match the current filters.</div>';
      return;
    }
    list.innerHTML = visible.map(function(r){
      return '<div class="report-card">'+
        videoThumbHtml(r)+
        '<div onclick="focusReport('+r.id+')">'+
          '<div class="top-row"><span class="tag '+r.type+'">'+r.type+'</span><span class="date">'+r.date+'</span></div>'+
          '<p class="name">'+escapeHtml(r.name)+'</p>'+
          (r.notes ? '<p class="notes">'+escapeHtml(r.notes)+'</p>' : '')+
        '</div>'+
        articleLinkHtml(r)+
        '</div>';
    }).join('');
  }

  function focusReport(id){
    var r = reports.find(function(x){return x.id===id;});
    if(!r) return;
    map.setView([r.lat, r.lng], 15, {animate:true});
    var m = markers[id];
    if(m){ if(!map.hasLayer(m)) m.addTo(map); m.openPopup(); }
  }

  function toggleFilter(el, val){
    activeFilters[val] = !activeFilters[val];
    el.classList.toggle('off', !activeFilters[val]);
    refreshVisibility();
    renderList();
  }

  function toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('hidden');
  }

  // init
  reports.forEach(addMarker);
