<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}

<body>

<h1 class="page-title">NCR DOT MAP</h1>
<p class="page-sub">The real Delhi &amp; Gurugram district shapes, rasterized into dots &middot; same boundaries and marker positions as the Leaflet map</p>

<div class="type-bar" id="type-bar">

<div class="game-frame" id="frame">

<script>
  // Exact same district boundaries used by index.html / safety-guide-en.html
  // (real coordinates from OpenStreetMap via Nominatim) — this is what
  // makes the dots trace the true shape of Delhi and Gurugram, not an
  // invented layout.
  var DELHI_BOUNDARY = [[28.5825,76.8394],[28.5500,76.8459],[28.5437,76.8644],[28.5203,76.8871],[28.5056,76.8805],[28.5014,76.8854],[28.5138,76.9069],[28.5053,76.9528],[28.5213,76.9784],[28.5147,77.0101],[28.5211,77.0170],[28.5335,77.0017],[28.5405,77.0135],[28.5252,77.0434],[28.5166,77.0462],[28.5119,77.0672],[28.5203,77.0723],[28.5180,77.0804],[28.4951,77.1195],[28.4732,77.1125],[28.4428,77.1277],[28.4285,77.1628],[28.4062,77.1715],[28.4102,77.2179],[28.4250,77.2500],[28.4544,77.2459],[28.4585,77.2331],[28.4788,77.2434],[28.4965,77.2902],[28.4834,77.3141],[28.5135,77.3453],[28.5563,77.2998],[28.5762,77.2929],[28.5965,77.3134],[28.6051,77.3412],[28.6236,77.3404],[28.6377,77.3168],[28.6779,77.3252],[28.6816,77.3330],[28.6987,77.3237],[28.7132,77.3311],[28.7064,77.2913],[28.7227,77.2909],[28.7356,77.2757],[28.7385,77.2558],[28.7526,77.2587],[28.7592,77.2381],[28.7750,77.2329],[28.7792,77.2210],[28.7846,77.2280],[28.7867,77.2073],[28.7970,77.2000],[28.8136,77.2021],[28.8108,77.2187],[28.8223,77.2237],[28.8558,77.2142],[28.8585,77.1752],[28.8368,77.1580],[28.8381,77.1453],[28.8617,77.1402],[28.8580,77.1219],[28.8834,77.0826],[28.8672,77.0747],[28.8680,77.0583],[28.8318,77.0402],[28.8396,76.9944],[28.8215,76.9803],[28.8277,76.9658],[28.8149,76.9617],[28.8161,76.9492],[28.7987,76.9419],[28.7903,76.9540],[28.7798,76.9483],[28.7677,76.9557],[28.7539,76.9444],[28.7428,76.9588],[28.7299,76.9598],[28.7125,76.9481],[28.6992,76.9680],[28.6696,76.9545],[28.6702,76.9374],[28.6496,76.9245],[28.6331,76.9444],[28.6272,76.9424],[28.6184,76.9353],[28.6315,76.9191],[28.6236,76.9065],[28.6318,76.8894],[28.5855,76.8646],[28.5825,76.8394]];
  var GURUGRAM_BOUNDARY = [[28.3071,76.6510],[28.3025,76.6671],[28.3167,76.6737],[28.3138,76.6857],[28.2693,76.6738],[28.2631,76.6784],[28.2634,76.7148],[28.2401,76.7690],[28.2237,76.7813],[28.2556,76.7976],[28.2536,76.8114],[28.2406,76.8125],[28.2442,76.8256],[28.2344,76.8577],[28.2623,76.8763],[28.2523,76.8991],[28.2767,76.9180],[28.3006,76.9050],[28.2993,76.9164],[28.3243,76.9332],[28.3127,76.9516],[28.3269,76.9611],[28.3256,76.9712],[28.3346,76.9786],[28.3257,76.9995],[28.3052,77.0110],[28.2481,77.0215],[28.2441,77.0563],[28.2230,77.0548],[28.2165,77.0621],[28.2147,77.0712],[28.2300,77.0816],[28.2193,77.0942],[28.2273,77.1027],[28.2179,77.1210],[28.2266,77.1339],[28.2006,77.1715],[28.2118,77.2023],[28.2293,77.2015],[28.2353,77.1911],[28.2452,77.1953],[28.2793,77.2419],[28.2989,77.2082],[28.2894,77.2008],[28.3177,77.1567],[28.3838,77.1514],[28.4046,77.1741],[28.4285,77.1628],[28.4428,77.1277],[28.4732,77.1125],[28.4951,77.1195],[28.5180,77.0804],[28.5203,77.0723],[28.5119,77.0672],[28.5166,77.0462],[28.5252,77.0434],[28.5409,77.0078],[28.5310,77.0013],[28.5211,77.0170],[28.5147,77.0101],[28.5213,76.9784],[28.5053,76.9528],[28.5138,76.9069],[28.5008,76.8919],[28.5047,76.8819],[28.4978,76.8743],[28.5041,76.8248],[28.4751,76.8109],[28.4642,76.7913],[28.4774,76.7717],[28.4595,76.7602],[28.4612,76.7507],[28.4700,76.7349],[28.4863,76.7260],[28.4929,76.7050],[28.4576,76.7071],[28.4357,76.7175],[28.4001,76.7083],[28.3748,76.7353],[28.3565,76.7265],[28.3541,76.7157],[28.3790,76.6693],[28.3071,76.6510]];

  var tactics = [
    {id:1, name:"Fake \"Tourism Office\" Redirect", type:"scam", emoji:"🪪", area:"India Gate / Connaught Place", lat:28.6129, lng:77.2295, summary:"A friendly stranger strikes up conversation near a landmark and offers a free rickshaw tour, then leads visitors to an unofficial travel agency displaying a fake \"Ministry of Tourism\" sign that pressures them into an overpriced multi-day package.", avoid:"Book tours only through your hotel or a pre-vetted operator."},
    {id:2, name:"\"Your Train Is Cancelled\" Redirect", type:"scam", emoji:"🚉", area:"New Delhi Railway Station", lat:28.6435, lng:77.2140, summary:"Someone claims the platform is closed or your train is cancelled, then guides travelers away from the station to a private travel agency instead.", avoid:"Check train status only on the official IRCTC app or with uniformed railway staff."},
    {id:3, name:"Rigged Taxi Meter / Long Route", type:"scam", emoji:"🚕", area:"IGI Airport", lat:28.5562, lng:77.1000, summary:"Drivers take a deliberately roundabout route, claim the meter is broken, or demand a high flat fare once the ride is underway.", avoid:"Use the official prepaid taxi counter or a ride-hailing app, and track the route yourself."},
    {id:4, name:"Street \"Ear Cleaning\" Health Scam", type:"scam", emoji:"👂", area:"Connaught Place", lat:28.6330, lng:77.2175, summary:"A self-described ear specialist offers a free inspection, then demands escalating cash payments to stop.", avoid:"Decline all unsolicited medical or grooming offers from strangers on the street."},
    {id:5, name:"Gem / Carpet \"Investment\" Scam", type:"scam", emoji:"💎", area:"Karol Bagh / Old Delhi markets", lat:28.6519, lng:77.1909, summary:"A shop convinces a traveler that goods bought cheaply can be resold for a huge profit back home, then arranges a \"shipping\" deal that never delivers value.", avoid:"Never buy anything framed as a resale investment."},
    {id:6, name:"Currency Short-Counting", type:"scam", emoji:"💵", area:"Paharganj", lat:28.6440, lng:77.2110, summary:"A vendor counts change quickly and hands back less than owed, or swaps a large note for a smaller one during a distracting handoff.", avoid:"Count all cash slowly and openly before completing a transaction."},
    {id:7, name:"Crowd Pickpocketing", type:"theft", emoji:"👛", area:"Chandni Chowk market", lat:28.6506, lng:77.2303, summary:"In dense markets, pickpockets work in pairs — one creates a distraction while another lifts a wallet or phone.", avoid:"Keep valuables in a zipped front pocket and bags worn to the front in crowds."},
    {id:8, name:"Distraction Bag-Snatching Team", type:"theft", emoji:"🎒", area:"Cyber Hub, Gurugram", lat:28.4950, lng:77.0891, summary:"A group distracts a visitor while an accomplice grabs an unattended bag or phone off a table.", avoid:"Never leave a bag or phone unattended, even for a moment."},
    {id:9, name:"Aggressive Begging / Child Gangs", type:"violence", emoji:"✋", area:"Chandni Chowk area", lat:28.6490, lng:77.2280, summary:"Groups of children, often directed by adults, surround visitors and grab at clothing or arms, not backing off easily when refused.", avoid:"Keep walking calmly toward a shop or crowd rather than stopping to argue."},
    {id:10, name:"Nightlife Area Harassment", type:"violence", emoji:"⚠️", area:"Sector 29, Gurugram", lat:28.4593, lng:77.0724, summary:"Around bar streets late at night, groups can surround and closely follow visitors, escalating if ignored for too long.", avoid:"Travel in a group after dark and keep a ride-hailing app ready."}
  ];

  var activeTypes = {scam:true, theft:true, violence:true};

  // ---- retro chiptune audio (Web Audio API, synthesized — no audio files) ----
  var audioCtx = null;
  var soundOn = false;
  var musicTimer = null;
  var noteIndex = 0;
  var MELODY = [523, 587, 659, 784, 880, 784, 659, 587];
  var BASS   = [131, 131, 196, 196, 131, 131, 196, 196];
  var NOTE_MS = 260;

  function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, duration, waveType, startTime, peakGain){
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = waveType;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(peakGain, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playSelectSfx(){
    if(!soundOn) return;
    ensureAudio();
    var t = audioCtx.currentTime;
    beep(880, 0.05, 'square', t, 0.05);
    beep(1320, 0.06, 'square', t + 0.05, 0.04);
  }

  function playCloseSfx(){
    if(!soundOn) return;
    ensureAudio();
    var t = audioCtx.currentTime;
    beep(660, 0.05, 'square', t, 0.04);
    beep(440, 0.07, 'square', t + 0.05, 0.04);
  }

  function musicStep(){
    if(!soundOn) return;
    var t = audioCtx.currentTime;
    beep(MELODY[noteIndex % MELODY.length], NOTE_MS/1000*0.85, 'square', t, 0.03);
    beep(BASS[noteIndex % BASS.length], NOTE_MS/1000*0.85, 'triangle', t, 0.045);
    noteIndex++;
    musicTimer = setTimeout(musicStep, NOTE_MS);
  }

  function toggleSound(){
    soundOn = !soundOn;
    var btn = document.getElementById('sound-btn');
    if(soundOn){
      ensureAudio();
      btn.textContent = String.fromCodePoint(0x1F50A) + ' SOUND: ON';
      noteIndex = 0;
      musicStep();
    } else {
      btn.textContent = String.fromCodePoint(0x1F508) + ' SOUND: OFF';
      clearTimeout(musicTimer);
    }
  }

  // Bounding box across both real boundaries, with a little padding.
  var B = (function(){
    var minLat=90, maxLat=-90, minLng=180, maxLng=-180;
    [DELHI_BOUNDARY, GURUGRAM_BOUNDARY].forEach(function(poly){
      poly.forEach(function(p){
        if(p[0]<minLat) minLat=p[0];
        if(p[0]>maxLat) maxLat=p[0];
        if(p[1]<minLng) minLng=p[1];
        if(p[1]>maxLng) maxLng=p[1];
      });
    });
    var padLat=(maxLat-minLat)*0.08, padLng=(maxLng-minLng)*0.08;
    return {minLat:minLat-padLat, maxLat:maxLat+padLat, minLng:minLng-padLng, maxLng:maxLng+padLng};
  })();

  // Canvas is sized to the bounding box's true aspect ratio (with a
  // latitude-based longitude correction) so the dot shape isn't stretched.
  var centerLat = (B.minLat+B.maxLat)/2;
  var lngCompress = Math.cos(centerLat*Math.PI/180);
  var aspect = ((B.maxLng-B.minLng)*lngCompress) / (B.maxLat-B.minLat);
  var CANVAS_H = 560;
  var CANVAS_W = Math.round(CANVAS_H*aspect);
  var CELL = 7;

  function project(lat, lng){
    return {
      x: (lng-B.minLng)/(B.maxLng-B.minLng)*CANVAS_W,
      y: (B.maxLat-lat)/(B.maxLat-B.minLat)*CANVAS_H
    };
  }

  function pointInPolygon(lat, lng, poly){
    var inside = false;
    for(var i=0, j=poly.length-1; i<poly.length; j=i++){
      var latI=poly[i][0], lngI=poly[i][1], latJ=poly[j][0], lngJ=poly[j][1];
      var hit = ((lngI>lng) !== (lngJ>lng)) && (lat < (latJ-latI)*(lng-lngI)/(lngJ-lngI)+latI);
      if(hit) inside = !inside;
    }
    return inside;
  }

  function centroidLatLng(poly){
    var sLat=0, sLng=0;
    poly.forEach(function(p){ sLat+=p[0]; sLng+=p[1]; });
    return [sLat/poly.length, sLng/poly.length];
  }

  function drawBoundary(ctx, poly){
    ctx.beginPath();
    poly.forEach(function(p, i){
      var pt = project(p[0], p[1]);
      if(i===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
    });
    ctx.closePath();
    ctx.strokeStyle = '#7fd1c9';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#7fd1c9';
    ctx.shadowBlur = 5;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawWorld(){
    var frame = document.getElementById('frame');
    frame.style.aspectRatio = CANVAS_W + '/' + CANVAS_H;
    var canvas = document.getElementById('world');
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Rasterize the two real district polygons into a dot grid — every
    // dot's presence/absence traces the true Delhi/Gurugram shape.
    for(var py=CELL/2; py<CANVAS_H; py+=CELL){
      for(var px=CELL/2; px<CANVAS_W; px+=CELL){
        var lng = B.minLng + (px/CANVAS_W)*(B.maxLng-B.minLng);
        var lat = B.maxLat - (py/CANVAS_H)*(B.maxLat-B.minLat);
        var inside = pointInPolygon(lat, lng, DELHI_BOUNDARY) || pointInPolygon(lat, lng, GURUGRAM_BOUNDARY);
        if(!inside) continue;
        ctx.beginPath();
        ctx.arc(px, py, CELL*0.36, 0, Math.PI*2);
        ctx.fillStyle = '#c9d6c8';
        ctx.fill();
      }
    }

    drawBoundary(ctx, DELHI_BOUNDARY);
    drawBoundary(ctx, GURUGRAM_BOUNDARY);
  }

  function pctFromLatLng(lat, lng){
    var p = project(lat, lng);
    return {left: (p.x/CANVAS_W*100).toFixed(2)+'%', top: (p.y/CANVAS_H*100).toFixed(2)+'%'};
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderSprites(){
    var layer = document.getElementById('sprite-layer');
    var delhiC = centroidLatLng(DELHI_BOUNDARY);
    var guruC = centroidLatLng(GURUGRAM_BOUNDARY);
    var pDelhi = pctFromLatLng(delhiC[0], delhiC[1]);
    var pGuru = pctFromLatLng(guruC[0], guruC[1]);
    var html = '<div class="place-label" style="left:'+pDelhi.left+';top:'+pDelhi.top+';">DELHI</div>'+
                '<div class="place-label" style="left:'+pGuru.left+';top:'+pGuru.top+';">GURUGRAM</div>';
    html += tactics.map(function(t){
      var p = pctFromLatLng(t.lat, t.lng);
      var hidden = activeTypes[t.type] ? '' : ' hidden';
      return '<div class="sprite '+t.type+hidden+'" data-id="'+t.id+'" style="left:'+p.left+';top:'+p.top+';" '+
             'onclick="openDialog('+t.id+')" title="'+escapeHtml(t.name)+'">'+t.emoji+'</div>';
    }).join('');
    layer.innerHTML = html;
  }

  function toggleType(el, val){
    playSelectSfx();
    activeTypes[val] = !activeTypes[val];
    el.classList.toggle('off', !activeTypes[val]);
    document.querySelectorAll('.sprite.'+val).forEach(function(s){
      s.classList.toggle('hidden', !activeTypes[val]);
    });
  }

  function openDialog(id){
    var t = tactics.find(function(x){ return x.id === id; });
    if(!t) return;
    playSelectSfx();
    document.getElementById('hint').style.display = 'none';
    var content = document.getElementById('dialog-content');
    content.innerHTML =
      '<span class="dialog-tag '+t.type+'">'+t.type+'</span>'+
      '<p class="dialog-name">'+t.emoji+' '+escapeHtml(t.name)+'</p>'+
      '<p class="dialog-area">'+escapeHtml(t.area)+'</p>'+
      '<p class="dialog-summary">'+escapeHtml(t.summary)+'</p>'+
      '<p class="dialog-avoid"><b>AVOID IT:</b> '+escapeHtml(t.avoid)+'</p>';
    document.getElementById('dialog').classList.add('open');
  }

  function closeDialog(){
    playCloseSfx();
    document.getElementById('dialog').classList.remove('open');
  }
